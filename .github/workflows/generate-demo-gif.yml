name: Generate README demo GIF

on:
  push:
    paths:
      - tools/Generate-ReadmeDemoGif.ps1
      - .github/workflows/generate-demo-gif.yml

permissions:
  contents: write

jobs:
  generate-demo:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate demo GIF
        shell: pwsh
        run: .\tools\Generate-ReadmeDemoGif.ps1

      - name: Commit generated GIF
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if (git status --porcelain -- assets/ciphervault-demo.gif) {
              git add assets/ciphervault-demo.gif
              git commit -m 'Regenerate README demo GIF'
              git push
          }
