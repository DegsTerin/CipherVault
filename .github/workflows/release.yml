name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-artifact:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PowerShell version
        shell: pwsh
        run: |
          if ([version]$PSVersionTable.PSVersion -lt [version]'7.4') {
            throw "PowerShell 7.4+ is required. Detected version: $($PSVersionTable.PSVersion)"
          }

      - name: Validate Python launcher
        shell: pwsh
        run: |
          if (-not (Get-Command python.exe -ErrorAction SilentlyContinue)) {
            throw 'Python is required to validate CipherVault.pyw.'
          }
          python --version
          python -m py_compile .\CipherVault.pyw

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -Confirm:$false
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Confirm:$false

      - name: Repository audit and tests
        shell: pwsh
        run: |
          & .\tools\Invoke-RepositoryAudit.ps1
          & .\tools\Invoke-Checks.ps1

      - name: Build source artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}'
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: '$version'. Use vMAJOR.MINOR.PATCH."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tracked = @(git ls-files)
          if ($LASTEXITCODE -ne 0 -or $tracked.Count -eq 0) { throw 'Unable to obtain the versioned files.' }
          $sensitive = @($tracked | Where-Object { $_ -match '(?i)(^|/)(\.env(?:\.|$)|credentials?|secrets?|tokens?)(?:/|$)' -or $_ -match '(?i)\.(pem|pfx|p12|key)$' -or $_ -eq 'test-results.xml' })
          if ($sensitive.Count -gt 0) { throw "Sensitive/local files detected in release: $($sensitive -join ', ')" }
          $paths = @($tracked | ForEach-Object { Join-Path (Get-Location) $_ })
          Compress-Archive -Path $paths -DestinationPath "dist/CipherVault-$version.zip" -Force
          $hash = (Get-FileHash "dist/CipherVault-$version.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CipherVault-$version.zip" | Set-Content -NoNewline -Encoding utf8 "dist/SHA256SUMS.txt"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CipherVault-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Attest source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/CipherVault-${{ github.ref_name }}.zip
