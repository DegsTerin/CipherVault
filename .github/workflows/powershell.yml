name: PowerShell CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PowerShell version
        shell: pwsh
        run: |
          if ([version]$PSVersionTable.PSVersion -lt [version]'7.4') {
            throw "PowerShell 7.4+ is required. Detected version: $($PSVersionTable.PSVersion)"
          }

      - name: Validate Python launcher
        shell: pwsh
        run: |
          if (-not (Get-Command python.exe -ErrorAction SilentlyContinue)) {
            throw 'Python is required to validate CipherVault.pyw.'
          }
          python --version
          python -m py_compile .\CipherVault.pyw

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -Confirm:$false
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Confirm:$false

      - name: Static analysis
        shell: pwsh
        run: |
          $results = @(
            Get-ChildItem -Path . -Recurse -File -Filter *.ps1 |
              ForEach-Object {
                Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
              }
          )

          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

      - name: Repository audit
        shell: pwsh
        run: |
          & .\tools\Invoke-RepositoryAudit.ps1

      - name: Tests
        shell: pwsh
        run: |
          & .\tools\Invoke-Checks.ps1
